services:
  # ============================================================================
  # BASE DE DATOS POSTGRESQL (Reactiva compatible con R2DBC)
  # ============================================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: franchise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: franchise_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d franchise_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - franchise-network

  # ============================================================================
  # SERVICIO BACKEND: SPRING WEBFLUX + R2DBC API
  # ============================================================================
  franchise-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchise-service-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: franchise_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      PORT: 8080
      SPRING_SQL_INIT_MODE: always
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - franchise-network

networks:
  franchise-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
